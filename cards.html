<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>卡片資料庫 | 流光秘境攻略</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Noto+Sans+TC:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/card-face.css">
<style>
  .cards-layout { display: grid; grid-template-columns: 300px 1fr; gap: 28px; align-items: start; }
  .cards-layout aside { position: sticky; top: 78px; background: var(--bg-card); border: 1px solid var(--border-soft); border-radius: var(--radius-md); padding: 18px; max-height: calc(100vh - 100px); overflow-y: auto; }
  .result-bar { display:flex; justify-content:space-between; align-items:center; margin-bottom: 14px; color: var(--text-dim); font-size: 0.85rem; }
  @media (max-width: 900px) {
    .cards-layout { grid-template-columns: 1fr; }
    .cards-layout aside { position: static; max-height: none; }
  }
</style>
</head>
<body>
<div id="navbar-host"></div>

<header class="container page-header">
  <div class="page-eyebrow">Card Database</div>
  <h1>卡片資料庫</h1>
  <p>所有篩選條件同時生效，可以逐步縮小範圍。</p>
</header>

<main class="container">
  <div class="cards-layout">
    <aside id="filter-host"></aside>
    <div>
      <div class="result-bar" id="result-count">載入中…</div>
      <div id="card-grid-host"></div>
    </div>
  </div>
</main>

<div id="footer-host"></div>

<script type="module" src="src/pages/cardsPage.js"></script>
</body>
</html>
